<!DOCTYPE html>
<html>

<head>
    <title>MusicFest ID Card</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=Reenie+Beanie&family=Special+Gothic+Expanded+One&family=Prompt:wght@400;600;700&family=Doto&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --blue-dark: #2657ab;
            --blue-light: #5773a1;
            --green-dark: #377253;
            --green-light: #457b61;
            --red-accent: #bb4237;
            --bg-cream: #dee0d1;
            --black: #000
        }

        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            gap: 16px;
            padding-top: 20px;
            overflow-x: hidden; /* Prevent horizontal scroll on mobile */
        }

        /* --- WRAPPERS (KEY MOBILE FIX) --- */
        /* This ensures the wrappers don't force the page to be 600px wide */
        #cardWrapper, #idCardBackWrapper {
            position: relative;
            margin: 0 auto;
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* CRITICAL: Hides the "ghost" width of scaled elements */
        }

        /* Add top margin specifically to wrappers, handled by JS scaling */
        #cardWrapper { margin-top: 20px; }
        #idCardBackWrapper { margin-top: 20px; }

        /* Wrapper for download capture: headings + cards only (no controls) */
        #downloadArea {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding-top: 20px;
            background-color: #f0f0f0;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        /* --- CROPPER MODAL STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 10px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .crop-container {
            width: 100%;
            height: 400px;
            background: #333;
            overflow: hidden;
        }

        .crop-container img {
            max-width: 100%;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* --- ID CARD STYLES --- */
        #idCard {
            width: 600px;
            height: 380px;
            background-color: var(--bg-cream);
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0);
            flex-shrink: 0;
            
            background-image: url("data:image/svg+xml,%3Csvg width='14' height='14' viewBox='0 0 14 14' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23666958' fill-opacity='0.35'%3E%3Ccircle cx='1' cy='1' r='0.9'/%3E%3Ccircle cx='8' cy='8' r='0.9'/%3E%3C/g%3E%3C/svg%3E");
            background-repeat: repeat;
        }

        #idCardBack {
            width: 600px;
            height: 380px;
            position: relative;
            z-index: 1;
            background: transparent;
            flex-shrink: 0;
        }

        .back-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .star {
            position: absolute;
            font-size: 220px;
            line-height: 1;
            filter: drop-shadow(6px 6px 0 rgba(255, 255, 255, 0.35));
            z-index: 2;
        }

        .star-red {
            top: -120px;
            right: -37px;
            color: var(--red-accent);
            transform: rotate(-15deg);
            z-index: 4;
            mix-blend-mode: hard-light;
        }

        .star-red-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        .star-blue {
            bottom: -60px;
            left: 10px;
            font-size: 190px;
            color: var(--blue-light);
            transform: rotate(-10deg);
        }

        .star-green {
            top: -40px;
            left: -20px;
            font-size: 200px;
            color: var(--green-light);
            transform: rotate(-8deg);
        }

        .header-bar {
            background-color: var(--green-dark);
            height: 85px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: relative;
            z-index: 3;
        }

        .header-text {
            font-family: 'Special Gothic Expanded One', sans-serif;
            font-size: 65px;
            font-weight: 900;
            letter-spacing: -1px;
            color: #000000;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .editable-inline {
            outline: none;
            cursor: text;
        }

        #sigSpace {
            font-family: 'Reenie Beanie', cursive;
            border-bottom: 3px dotted #000000;
            min-width: 120px;
            text-transform: uppercase;
            font-size: 70px;
            letter-spacing: 2px;
            color: #ffffff;
            line-height: 0.6;
            position: relative;
            top: 6px;
            display: inline-block;
        }

        #headerDate {
            position: absolute;
            right: 4px;
            top: 59px;
            transform: translateY(-50%);
            font-family: 'Doto', monospace;
            font-size: 20px;
            letter-spacing: -2px;
            color: #ffffff;
            z-index: 5;
        }

        .card-body {
            display: flex;
            padding: 20px 35px;
            gap: 30px;
            z-index: 3;
        }

        .photo-area {
            width: 170px;
            height: 170px;
            background-color: #dee0d1;
            border: 6px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
            margin-top: 10px;
            position: relative;
            z-index: 10;
        }

        #photoPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #photoPlaceholder {
            font-size: 14px;
            color: #666;
            text-align: center;
            padding: 10px;
        }

        .photo-upload-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 8px 14px;
            background-color: var(--green-dark);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            z-index: 5;
        }

        .info-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-top: 10px;
        }

        .field-row {
            padding-bottom: 2px;
            display: flex;
            align-items: baseline;
            gap: 10px
        }

        .field-label {
            font-weight: 600;
            margin-right: 4px;
            white-space: nowrap;
            font-size: 13px;
            width: 90px;
            text-align: left;
        }

        .field-value {
            color: #000;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            font-size: 18px;
            font-weight: bold;
            right: 30px;
            flex-grow: 1;
            border-bottom: 2px dotted #333;
            min-width: 50px;
            line-height: 1.0;
            vertical-align: baseline;
            position: relative;
        }

        .footer-bar {
            background-color: var(--blue-dark);
            height: 50px;
            width: 100%;
            position: absolute;
            bottom: 0;
            z-index: 2;
        }

        .footer-text-wrapper {
            position: absolute;
            bottom: 20px;
            right: 13px;
            z-index: 3;
            display: flex;
            align-items: baseline;
            gap: 1px;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--bg-cream);
            color: #000;
        }

        .label-yang { margin-right: 4px; }
        .label-yuu { margin-left: 4px; margin-right: 4px; }

        #footerMiddle, #footerAfter {
            width: 90px;
            line-height: 0.8;
            border-bottom: 5px dotted var(--black);
            text-transform: uppercase;
            outline: none;
            cursor: text;
            display: inline-block;
            white-space: nowrap;
        }

        #footerMiddle { min-width: 5px; }
        #footerAfter { min-width: 1px; }

        .footer-message {
            position: absolute;
            bottom: 13px;
            left: 26px;
            z-index: 3;
            font-size: 11px;
            color: #ffffff;
            font-family: 'Doto', monospace;
            text-align: center;
            line-height: 1.2;
        }

        .footer-text-head {
            position: absolute;
            bottom: 84px;
            right: 200px;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            font-size: 14px;
            font-weight: bold;
        }

        /* --- CONTROLS & BUTTONS --- */
        .controls {
            display: flex;
            flex-wrap: wrap;       /* ALLOW WRAPPING */
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
            padding: 0 10px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .btn {
            background-color: var(--blue-dark);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-weight: bold;
            font-family: 'Prompt', sans-serif;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
            display: inline-flex;  /* Keeps icon and text together */
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-cancel {
            background-color: #888;
        }

        .btn-icon-only {
            background-color: var(--green-dark);
            color: white;
            font-size: 20px;
            width: 46px;
            height: 46px;
            padding: 0;
            border-radius: 50%;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .file-label {
            display: inline-block;
            padding: 8px 14px;
            background-color: var(--green-dark);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .limit-reached {
            border-bottom-color: red !important;
        }

        #imgInput {
            display: none;
        }

        h1 {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            text-align: center;
            margin-bottom: -30px; /* Pulls the next element UP by 10px */
            line-height: 1;     /* Reduces vertical spread */
            padding-bottom: 0;
            font-size: 24px;
        }

        h2 {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            text-align: center;
            margin-top: 1;
            line-height: 1.2;
            font-size: 18px;
        }

        @media (max-width: 640px) {
            .cards-stack { gap: 10px; }
            .btn { font-size: 14px; padding: 8px 16px; }
        }

        /* Placeholder dots for empty editable fields */
        #dispW1:empty::before,
        #dispW2:empty::before,
        #dispW3:empty::before {
            content: "......";  /* The dots you want to see */
            color: #000000;        /* Light grey color */
            pointer-events: none; /* Allows click to pass through to the input */
        }

        /* Optional: Ensure the field has layout so it's clickable */
        #dispW1, #dispW2, #dispW3 {
            min-width: 30px;    /* Minimum width to ensure touch target */
            display: inline-block;
        }
    </style>
</head>

<body>

    <div id="downloadArea">
        <h1>You’re still young</h1>

    <!-- Hidden Crop Modal -->
    <div class="modal-overlay" id="cropModal">
        <div class="modal-content">
            <h3 style="margin:0;">Adjust Photo</h3>
            <div class="crop-container">
                <img id="imageToCrop" src="">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="btnCancelCrop">Cancel</button>
                <button class="btn" id="btnApplyCrop">Crop & Use</button>
            </div>
        </div>
    </div>

    <!-- FRONT CARD WRAPPER -->
    <div id="cardWrapper">
        <div id="idCard">
            <div class="star star-green">★</div>
            <div id="headerDate">13 FEB 2026</div>
            <div class="star-red-container">
                <div class="star star-red">★</div>
            </div>
            <div class="star star-blue">★</div>

            <div class="header-bar">
                <div class="header-text">
                    I <span id="sigSpace" class="editable-inline" contenteditable="true"></span> Card
                </div>
            </div>

            <div class="card-body">
                <div class="photo-area">
                    <img id="photoPreview" src="">
                    <span id="photoPlaceholder"></span>
                    <label for="imgInput" class="photo-upload-label" id="photoUploadLabel">Upload photo</label>
                </div>

                <div class="info-area">
                    <div class="field-row">
                        <span class="field-label">มายเนมอีส:</span>
                        <span class="field-value editable-inline" id="dispName" contenteditable="true"></span>
                    </div>
                    <div class="field-row">
                        <span class="field-label">วันที่คลอด:</span>
                        <span class="field-value dob editable-inline" id="dispDob" contenteditable="true"></span>
                    </div>
                    <div class="field-row">
                        <span class="field-label">3 คำเด็ด:</span>
                        <span class="field-value">
                            <span class="editable-inline" id="dispW1" contenteditable="true"></span> /
                            <span class="editable-inline" id="dispW2" contenteditable="true"></span> /
                            <span class="editable-inline" id="dispW3" contenteditable="true"></span>
                        </span>
                    </div>
                    <div class="field-row">
                        <span class="field-label">วงที่ชอบ:</span>
                        <span class="field-value editable-inline" id="dispBand" contenteditable="true"></span>
                    </div>
                    <div class="field-row">
                        <span class="field-label">เพลงโปรด:</span>
                        <span class="field-value editable-inline" id="dispSong" contenteditable="true"></span>
                    </div>
                </div>
            </div>

            <div class="footer-text-wrapper">
                <span id="footerMiddle" class="editable-inline" contenteditable="true"></span>
                <span class="label-yang">ยัง</span>
                <span id="footerAfter" class="editable-inline" contenteditable="true"></span>
                <span class="label-yuu">อยู่</span>
            </div>

            <div class="footer-message">
                <div class="footer-line-top">Who once holds this card always a</div>
                <div class="footer-young">“YOUNG”</div>
            </div>

            <div class="footer-text-head">"อยากจะบอกตัวเองไว้ว่า"</div>
            <div class="footer-bar"></div>
        </div>
    </div>

    <!-- BACK CARD WRAPPER -->
    <div id="idCardBackWrapper">
        <div id="idCardBack">
            <img src="image.png" class="back-img">
        </div>
    </div>

        <h1>TSS Music Festival 2026</h1>
        <h2>Young You</h2>
    </div>

    <div class="controls">
        <label for="imgInput" class="btn" id="btnControlUpload">
            <i class="fa-solid fa-camera"></i> Upload Image
        </label>

        <button class="btn" id="btnDownload">
            <i class="fa-solid fa-download"></i>
            Download Card
        </button>

        <button class="btn btn-icon-only" onclick="shareToInstagram()" aria-label="Share to Instagram">
            <i class="fa-solid fa-share-nodes"></i>
        </button>
    </div>

    <input type="file" id="imgInput" accept="image/*">

<script>
    const id = document.getElementById.bind(document);

    const imgInput = id('imgInput');
    const photoPreview = id('photoPreview');
    const photoPlaceholder = id('photoPlaceholder');
    const photoUploadLabel = id('photoUploadLabel');

    const cropModal = id('cropModal');
    const imageToCrop = id('imageToCrop');
    const btnApplyCrop = id('btnApplyCrop');
    const btnCancelCrop = id('btnCancelCrop');

    let cropper = null;

    // --- IMAGE LOGIC (Unchanged) ---
    imgInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            imageToCrop.src = ev.target.result;
            cropModal.style.display = 'flex';

            if (cropper) cropper.destroy();
            cropper = new Cropper(imageToCrop, {
                aspectRatio: 1,
                viewMode: 1,
                autoCropArea: 1
            });
            imgInput.value = '';
        };
        reader.readAsDataURL(file);
    });

    btnCancelCrop.addEventListener('click', () => {
        cropModal.style.display = 'none';
        if (cropper) cropper.destroy();
    });

    btnApplyCrop.addEventListener('click', () => {
        if (!cropper) return;
        const croppedCanvas = cropper.getCroppedCanvas({ width: 400, height: 400 });

        photoPreview.src = croppedCanvas.toDataURL('image/png');
        photoPreview.style.display = 'block';
        photoPlaceholder.style.display = 'none';
        
        const topLabel = document.getElementById('photoUploadLabel');
        if (topLabel) topLabel.style.display = 'none';

        const bottomBtn = document.getElementById('btnControlUpload');
        if (bottomBtn) bottomBtn.innerHTML = '<i class="fa-solid fa-camera"></i> Change Image';

        cropModal.style.display = 'none';
        cropper.destroy();
        cropper = null;
    });

    // --- CHARACTER LIMIT LOGIC (SIMPLIFIED & ROBUST) ---
    
    function getThaiLength(str) {
        // Thai combining vowels/marks don't count towards length
        const combining = /[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/g;
        return str.replace(combining, '').length;
    }

    const limits = {
        sigSpace: 7, 
        dispName: 22,
        dispDob: 10,
        dispW1: 5,
        dispW2: 5,
        dispW3: 5,
        dispBand: 22,
        dispSong: 22,
        footerMiddle: 3,
        footerAfter: 3
    };

    // Helper to keep cursor at end (Prevents cursor jumping to start)
    function setEndOfContenteditable(contentEditableElement) {
        var range, selection;
        if (document.createRange) {
            range = document.createRange();
            range.selectNodeContents(contentEditableElement);
            range.collapse(false);
            selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }
    }

    Object.keys(limits).forEach(elId => {
        const el = id(elId);
        
        el.addEventListener('input', function() {
            const max = limits[elId];
            let text = el.innerText;
            
            // 1. DATE FORMATTING (Specific to dispDob)
            if (elId === 'dispDob') {
                // Strip non-numbers
                let val = text.replace(/\D/g, '');
                
                // Add slashes
                if (val.length > 2) val = val.substring(0, 2) + '/' + val.substring(2);
                if (val.length > 5) val = val.substring(0, 5) + '/' + val.substring(5, 9);
                
                // Only update if changed (prevents loops)
                if (text !== val) {
                    el.innerText = val;
                    setEndOfContenteditable(el);
                    text = val; // Update local text var for length check below
                }
            }

            // 2. LENGTH CHECK (The Simple "Snip" Method)
            if (getThaiLength(text) > max) {
                // If text is too long, cut it immediately
                // We convert to array to handle emojis/thai chars safely if needed, 
                // but simple substring often works for basic limits.
                // Here we loop to safe-delete until it fits (handles Thai chars better)
                while (getThaiLength(el.innerText) > max) {
                    el.innerText = el.innerText.substring(0, el.innerText.length - 1);
                }
                
                // Add red warning class
                el.classList.add('limit-reached');
                
                // Move cursor to end so user can keep deleting if they want
                setEndOfContenteditable(el);
            } else {
                el.classList.remove('limit-reached');
            }
        });

        // Block Enter Key
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') e.preventDefault();
        });
        
        // Clean Paste
        el.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text');
            document.execCommand("insertText", false, text.replace(/[\r\n]+/g, ""));
        });
    });

    // --- SCALING LOGIC (Unchanged) ---
    function scaleCard() {
        const cardFront = document.getElementById('idCard');
        const wrapperFront = document.getElementById('cardWrapper');
        const cardBack = document.getElementById('idCardBack');
        const wrapperBack = document.getElementById('idCardBackWrapper');

        const windowWidth = window.innerWidth;
        const margin = 20;

        if (windowWidth < 640) {
            const s = (windowWidth - margin * 2) / 600;
            const heightDifference = 380 * (1 - s);

            cardFront.style.transform = `scale(${s})`;
            cardFront.style.transformOrigin = 'top center';
            wrapperFront.style.marginBottom = `-${heightDifference}px`;

            cardBack.style.transform = `scale(${s})`;
            cardBack.style.transformOrigin = 'top center';
            wrapperBack.style.marginBottom = `-${heightDifference}px`;
        } else {
            cardFront.style.transform = 'scale(1)';
            wrapperFront.style.marginBottom = '0px';
            cardBack.style.transform = 'scale(1)';
            wrapperBack.style.marginBottom = '0px';
        }
    }

    window.addEventListener('resize', scaleCard);
    scaleCard();

    // --- DOWNLOAD LOGIC: whole screen (headings + cards) in 9:16, no controls ---
    id('btnDownload').addEventListener('click', async () => {
        const downloadArea = id('downloadArea');
        const card = id('idCard');
        const cardBack = id('idCardBack');
        const wrapperFront = id('cardWrapper');
        const wrapperBack = id('idCardBackWrapper');

        // Restore full size for capture
        card.style.transform = 'scale(1)';
        cardBack.style.transform = 'scale(1)';
        wrapperFront.style.marginBottom = '0px';
        wrapperBack.style.marginBottom = '0px';

        // On mobile, wrappers are viewport-width with overflow:hidden → sides get clipped.
        // Temporarily force full 600px width and visible overflow so capture includes full cards.
        const CARD_WIDTH = 600;
        const savedAreaWidth = downloadArea.style.width;
        const savedAreaMaxWidth = downloadArea.style.maxWidth;
        const savedWrap1Width = wrapperFront.style.width;
        const savedWrap1Overflow = wrapperFront.style.overflow;
        const savedWrap2Width = wrapperBack.style.width;
        const savedWrap2Overflow = wrapperBack.style.overflow;

        downloadArea.style.width = CARD_WIDTH + 'px';
        downloadArea.style.maxWidth = CARD_WIDTH + 'px';
        wrapperFront.style.width = CARD_WIDTH + 'px';
        wrapperFront.style.overflow = 'visible';
        wrapperBack.style.width = CARD_WIDTH + 'px';
        wrapperBack.style.overflow = 'visible';

        try {
            const captured = await html2canvas(downloadArea, {
                scale: 2,
                backgroundColor: '#f0f0f0',
                logging: false
            });

            // 9:16 portrait (e.g. 1080x1920 for stories/reels)
            const outW = 1080;
            const outH = 1920;
            const combinedCanvas = document.createElement('canvas');
            combinedCanvas.width = outW;
            combinedCanvas.height = outH;
            const ctx = combinedCanvas.getContext('2d');

            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, outW, outH);

            const scale = Math.min(outW / captured.width, outH / captured.height);
            const drawW = captured.width * scale;
            const drawH = captured.height * scale;
            const x = (outW - drawW) / 2;
            const y = (outH - drawH) / 2;
            ctx.drawImage(captured, x, y, drawW, drawH);

            combinedCanvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'musicfest-id-card.png';
                a.click();
                URL.revokeObjectURL(url);
            });
        } catch (err) {
            console.error('Download error:', err);
            alert('Error generating image. Please try again.');
        } finally {
            // Restore layout (width/overflow so mobile scaling works again)
            downloadArea.style.width = savedAreaWidth;
            downloadArea.style.maxWidth = savedAreaMaxWidth;
            wrapperFront.style.width = savedWrap1Width;
            wrapperFront.style.overflow = savedWrap1Overflow;
            wrapperBack.style.width = savedWrap2Width;
            wrapperBack.style.overflow = savedWrap2Overflow;
            scaleCard(); // restore scaling and wrapper margins
        }
    });

    // --- SHARE LOGIC (Unchanged) ---
    async function shareToInstagram() {
        const cardElement = document.getElementById('idCard');
        if (!cardElement) return;

        try {
            const canvas = await html2canvas(cardElement, {
                scale: 2,
                backgroundColor: null,
                useCORS: true
            });

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], 'musicfest-id.png', { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            files: [file],
                            title: 'My MusicFest ID',
                            text: 'See you at MusicFest! #MusicFest2026'
                        });
                    } catch (e) { console.log('Cancelled'); }
                } else {
                    alert('Sharing not supported on this browser.');
                }
            }, 'image/png');
        } catch (error) {
            console.error(error);
        }
    }
</script>
