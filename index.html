<!DOCTYPE html>
<html>

<head>
    <title>MusicFest ID Card</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@100;200;300;400;500;600;700&family=Reenie+Beanie&family=Special+Gothic+Expanded+One&family=Prompt:wght@400;600;700&family=Doto&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">



    <style>
        :root {
            --blue-dark: #2657ab;
            --blue-light: #5773a1;
            --green-dark: #377253;
            --green-light: #457b61;
            --red-accent: #bb4237;
            --bg-cream: #dee0d1;
            --black: #000
        }

        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            gap: 16px;
            padding-top: 20px;
        }

        /* --- CROPPER MODAL STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 10px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .crop-container {
            width: 100%;
            height: 400px;
            background: #333;
            overflow: hidden;
        }

        .crop-container img {
            max-width: 100%;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* --- ID CARD STYLES --- */
        #idCard {
            width: 600px;
            height: 380px;
            background-color: var(--bg-cream);
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0);

            background-color: var(--bg-cream);

            background-image:
                radial-gradient(#6669585b 0.9px, transparent 0.9px),
                radial-gradient(#6669585b 0.9px, transparent 0.9px);

            background-size: 10px 10px;

            background-position: 0 0, 5px 5px;
        }

        .star {
            position: absolute;
            font-size: 220px;
            line-height: 1;
            filter: drop-shadow(6px 6px 0 rgba(255, 255, 255, 0.35));
            z-index: 2;
        }

        .star-red {
            top: -120px;
            right: -37px;
            color:
                var(--red-accent);
            transform:
                rotate(-15deg);
            z-index: 4;
            mix-blend-mode: hard-light;
        }

        .star-red-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        .star-blue {
            bottom: -60px;
            left: 10px;
            font-size: 190px;
            color: var(--blue-light);
            transform: rotate(-10deg);
        }

        .star-green {
            top: -40px;
            left: -20px;
            font-size: 200px;
            color: var(--green-light);
            transform: rotate(-8deg);
        }

        .header-bar {
            background-color: var(--green-dark);
            height: 85px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: relative;
            z-index: 3;
        }

        .header-text {
            font-family: 'Special Gothic Expanded One', sans-serif;
            font-size: 65px;
            font-weight: 900;
            letter-spacing: -1px;
            color: #000000;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .editable-inline {
            outline: none;
            cursor: text;
        }

        #sigSpace {
            font-family: 'Reenie Beanie', cursive;
            border-bottom: 3px dotted #000000;
            min-width: 120px;
            text-transform: uppercase;
            font-size: 70px;
            letter-spacing: 2px;
            color: #ffffff;
            line-height: 0.6;
            position: relative;
            top: 6px;
            display: inline-block;
        }

        #headerDate {
            position: absolute;
            right: 4px;
            top: 59px;
            transform: translateY(-50%);
            font-family: 'Doto', monospace;
            font-size: 20px;
            letter-spacing: -2px;
            color: #ffffff;
            z-index: 5;
        }

        .card-body {
            display: flex;
            padding: 20px 35px;
            gap: 30px;
            z-index: 3;
        }

        .photo-area {
            width: 170px;
            height: 170px;
            background-color: #dee0d1;
            border: 6px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
            margin-top: 10px;
            position: relative;
        }

        #photoPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        #photoPlaceholder {
            font-size: 14px;
            color: #666;
            text-align: center;
            padding: 10px;
        }

        .photo-upload-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 8px 14px;
            background-color: var(--green-dark);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            z-index: 5;
        }

        .info-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }

        .field-row {
            padding-bottom: 6px;
            display: flex;
            align-items: baseline;
            gap: 10px
        }

        .field-label {
            font-weight: 600;
            margin-right: 4px;
            white-space: nowrap;
            font-size: 13px;
            width: 90px;
            text-align: left;
        }

        .field-value {
            color: #000;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            font-size: 18px;
            font-weight: bold;
            right: 30px;

            flex-grow: 1;
            border-bottom: 2px dotted #333;
            min-width: 50px;

            line-height: 1.0;
            vertical-align: baseline;
            position: relative;
        }

        .footer-bar {
            background-color: var(--blue-dark);
            height: 50px;
            width: 100%;
            position: absolute;
            bottom: 0;
            z-index: 2;
        }

        .footer-text-wrapper {
            position: absolute;
            bottom: 20px;
            right: 13px;
            z-index: 3;
            display: flex;
            align-items: baseline;
            gap: 1px;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--bg-cream);
            color: #000;
        }

        .label-yang {
            margin-right: 4px;
        }

        .label-yuu {
            margin-left: 4px;
            margin-right: 4px;
        }

        #footerMiddle,
        #footerAfter {
            width: 90px;
            line-height: 0.8;
            border-bottom: 5px dotted var(--black);
            text-transform: uppercase;
            outline: none;
            cursor: text;
            display: inline-block;
            white-space: nowrap;

        }

        #footerMiddle {
            min-width: 5px;
        }

        #footerAfter {
            min-width: 1px;
        }

        .footer-message {
            position: absolute;
            bottom: 13px;
            left: 26px;
            z-index: 3;
            font-size: 11px;
            color: #ffffff;
            font-family: 'Doto', monospace;
            text-align: center;
            line-height: 1.2;
        }

        .footer-text-head {
            position: absolute;
            bottom: 66px;
            right: 236px;
            font-family: 'IBM Plex Sans Thai', sans-serif;
            font-size: 11px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            flex-direction: row; /* Change to row for side-by-side */
            justify-content: center;
            gap: 15px; /* Spacing between buttons */
            margin-top: 20px;
            margin-bottom: 40px; /* Add bottom margin so it doesn't touch screen edge */
        }

        .btn {
            padding: 10px 20px;
            background-color: var(--blue-dark);
            color: white;
            border: none;
            border-radius: 50px; /* Fully rounded buttons look better with icons */
            font-weight: bold;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px; /* Space between icon and text */
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-cancel {
            background-color: #888;
        }

        .btn-icon-only {
            padding: 12px;
            border-radius: 50%; /* Perfect circle */
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            background-color: var(--green-dark); /* Different color for share */
        }

        .file-label {
            display: inline-block;
            padding: 8px 14px;
            background-color: var(--green-dark);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .limit-reached {
            border-bottom-color: red !important;
        }

        #imgInput {
            display: none;
        }


        #idCardBackWrapper {
            position: relative;
            transform-origin: top center;
            margin-top: 20px; /* Space between cards */
        }

        /* The back card itself */
        #idCardBack {
            /* Match the front card's exact size */
            width: 600px; 
            height: 380px;
            
            position: relative;
            z-index: 1;
            background: transparent; 
        }

        .back-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the whole card image is visible */
            display: block;
        }

        h1 {
            font-family: 'IBM Plex Sans Thai', sans-serif;
        }
        h2 {
            font-family: 'IBM Plex Sans Thai', sans-serif;
        }

        @media (max-width: 640px) {
            .cards-stack {
                gap: 10px; /* Smaller gap on mobile */
            }
            
            /* Remove any default margins that might be adding up */
            #idCardWrapper, #idCardBackWrapper {
                margin: 0; 
                padding: 0;
            }
        }
    </style>
</head>

<body>

    <h1>You’re still young</h1>

    <!-- Hidden Crop Modal -->
    <div class="modal-overlay" id="cropModal">
        <div class="modal-content">
            <h3 style="margin:0;">Adjust Photo</h3>
            <div class="crop-container">
                <img id="imageToCrop" src="">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="btnCancelCrop">Cancel</button>
                <button class="btn" id="btnApplyCrop">Crop & Use</button>
            </div>
        </div>
    </div>



    <div id="cardWrapper"
        style="position: relative; margin: 20px auto; max-width: 600px; width: 100%; display: flex; flex-direction: column; align-items: center;">

        <div id="idCard" style="margin: 0; transform-origin: top center; flex-shrink: 0;">
            <div class="star star-green">★</div>

            <div id="headerDate">13 FEB 2026</div>

            <div class="star-red-container">
                <div class="star star-red">★</div>
            </div>

            <div class="star star-blue">★</div>

            <div class="header-bar">
                <div class="header-text">
                    I <span id="sigSpace" class="editable-inline" contenteditable="true"></span> Card
                </div>
            </div>

            <div class="card-body">
                <div class="photo-area">
                    <img id="photoPreview" src="">
                    <span id="photoPlaceholder"></span>
                    <label for="imgInput" class="photo-upload-label" id="photoUploadLabel">Upload photo</label>
                </div>

                <div class="info-area">
                    <div class="field-row">
                        <span class="field-label">มายเนมอีส:</span>
                        <span class="field-value editable-inline" id="dispName" contenteditable="true"></span>
                    </div>
                    <div class="field-row">
                        <span class="field-label">วันที่คลอด:</span>
                        <span class="field-value dob editable-inline" id="dispDob" contenteditable="true"></span>
                    </div>
                    <div class="field-row">
                        <span class="field-label">3 คำเด็ด:</span>
                        <span class="field-value">
                            <span class="editable-inline" id="dispW1" contenteditable="true"></span> /
                            <span class="editable-inline" id="dispW2" contenteditable="true"></span> /
                            <span class="editable-inline" id="dispW3" contenteditable="true"></span>
                        </span>
                    </div>
                    <div class="field-row">
                        <span class="field-label">วงที่ชอบ:</span>
                        <span class="field-value editable-inline" id="dispBand" contenteditable="true"></span>
                    </div>
                    <div class="field-row">
                        <span class="field-label">เพลงโปรด:</span>
                        <span class="field-value editable-inline" id="dispSong" contenteditable="true"></span>
                    </div>
                </div>
            </div>

            <div class="footer-text-wrapper">
                <span id="footerMiddle" class="editable-inline" contenteditable="true"></span>
                <span class="label-yang">ยัง</span>
                <span id="footerAfter" class="editable-inline" contenteditable="true"></span>
                <span class="label-yuu">อยู่</span>
            </div>

            <div class="footer-message">
                <div class="footer-line-top">Who once holds this card always a</div>
                <div class="footer-young">“YOUNG”</div>
            </div>

            <div class="footer-text-head">"อยากจะบอกตัวเองไว้ว่า"</div>

            <div class="footer-bar"></div>

        </div>
    </div>

    <div id="idCardBackWrapper">
        <div id="idCardBack">
            <img src="image.png" class="back-img">
        </div>
    </div>

    <h1>TSS Music Festival 2026</h1>
    <h2>Young You</h2>

    <div class="controls">

        <label for="imgInput" class="btn" id="btnControlUpload">
            <i class="fa-solid fa-camera"></i> Upload Image
        </label>

        <button class="btn" id="btnDownload">
            <i class="fa-solid fa-download"></i>
            Download Card
        </button>

        <button class="btn btn-icon-only" onclick="shareToInstagram()" aria-label="Share to Instagram">
            <i class="fa-solid fa-share-nodes"></i>
        </button>
    </div>

    <input type="file" id="imgInput" accept="image/*">


    <script>
        const id = document.getElementById.bind(document);

        const imgInput = id('imgInput');
        const photoPreview = id('photoPreview');
        const photoPlaceholder = id('photoPlaceholder');
        const photoUploadLabel = id('photoUploadLabel');

        const cropModal = id('cropModal');
        const imageToCrop = id('imageToCrop');
        const btnApplyCrop = id('btnApplyCrop');
        const btnCancelCrop = id('btnCancelCrop');

        let cropper = null;

        imgInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = (ev) => {
            imageToCrop.src = ev.target.result;
            cropModal.style.display = 'flex';

            if (cropper) cropper.destroy();
            cropper = new Cropper(imageToCrop, {
            aspectRatio: 1,
            viewMode: 1,
            autoCropArea: 1
            });

            // Reset AFTER the file is loaded (safe)
            imgInput.value = '';
        };

        reader.readAsDataURL(file);
        });

        btnCancelCrop.addEventListener('click', () => {
            cropModal.style.display = 'none';
            if (cropper) cropper.destroy();
        });

        btnApplyCrop.addEventListener('click', () => {
            if (!cropper) return;
            
            const croppedCanvas = cropper.getCroppedCanvas({
                width: 400,
                height: 400
            });
            
            // 1. Show the image
            photoPreview.src = croppedCanvas.toDataURL('image/png');
            photoPreview.style.display = 'block';
            
            // 2. Hide the placeholder and the TOP label (cleaner UI)
            photoPlaceholder.style.display = 'none';
            const topLabel = document.getElementById('photoUploadLabel');
            if (topLabel) topLabel.style.display = 'none';

            // 3. Update the BOTTOM button text
            const bottomBtn = document.getElementById('btnControlUpload');
            if (bottomBtn) {
                bottomBtn.innerHTML = '<i class="fa-solid fa-camera"></i> Change Image';
            }
            
            // 4. Cleanup
            cropModal.style.display = 'none';
            cropper.destroy();
            cropper = null;
        });

        function getThaiLength(str) {
            const combining = /[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/g;
            return str.replace(combining, '').length;
        }

        function enforceLimit(el, max) {
            const txt = el.textContent;
            const len = getThaiLength(txt);
            if (len > max) {
                el.classList.add('limit-reached');
            } else {
                el.classList.remove('limit-reached');
            }
        }

        const limits = {
            sigSpace: 8,
            dispName: 22,
            dispDob: 10,
            dispW1: 8,
            dispW2: 8,
            dispW3: 8,
            dispBand: 22,
            dispSong: 22,
            footerMiddle: 8,
            footerAfter: 3
        };

        Object.keys(limits).forEach(elId => {
            const el = id(elId);
            el.addEventListener('input', () => enforceLimit(el, limits[elId]));
        });

        function scaleCard() {
            // Get both wrappers and both cards
            const wrapperFront = document.getElementById('idCardWrapper');
            const cardFront = document.getElementById('idCard');
            const wrapperBack = document.getElementById('idCardBackWrapper');
            const cardBack = document.getElementById('idCardBack');
            
            const windowWidth = window.innerWidth;
            const margin = 20;

            if (windowWidth < 640) {
                const s = (windowWidth - margin * 2) / 600;
                
                // Scale Front
                cardFront.style.transform = `scale(${s})`;
                cardFront.style.transformOrigin = 'top center';
                
                // Scale Back
                cardBack.style.transform = `scale(${s})`;
                cardBack.style.transformOrigin = 'top center';

                // --- FIX START ---
                // Force the wrapper to be exactly the visual height of the scaled card
                const scaledHeight = 380 * s;
                
                wrapperFront.style.height = scaledHeight + "px";
                wrapperFront.style.width = (600 * s) + "px";
                wrapperFront.style.overflow = 'hidden'; // Key fix: Cut off any "ghost" space
                wrapperFront.style.marginBottom = "0px"; // Ensure no extra margin

                wrapperBack.style.height = scaledHeight + "px";
                wrapperBack.style.width = (600 * s) + "px";
                wrapperBack.style.overflow = 'hidden';
                wrapperBack.style.marginTop = "20px"; // Consistent gap between cards
                // --- FIX END ---

            } else {
                // ... (your existing else block) ...
                // Make sure to reset overflow here too
                wrapperFront.style.overflow = 'visible';
                wrapperBack.style.overflow = 'visible';
            }
        }

        window.addEventListener('resize', scaleCard);
        scaleCard();

        id('btnDownload').addEventListener('click', async () => {
            const wrapper = id('cardWrapper');
            const card = id('idCard');
            
            // Reset scale temporarily
            card.style.transform = 'scale(1)';
            
            try {
                // Capture front card
                const canvasFront = await html2canvas(card, {
                    scale: 2,
                    backgroundColor: null,
                    logging: false
                });


                // Create combined canvas
                const combinedCanvas = document.createElement('canvas');
                const ctx = combinedCanvas.getContext('2d');
                
                const cardWidth = canvasFront.width;
                const cardHeight = canvasFront.height;
                const gap = 60; // Gap between cards
                
                combinedCanvas.width = cardWidth;
                combinedCanvas.height = cardHeight * 2 + gap;
                
                // Fill background
                ctx.fillStyle = '#f5f5f5';
                ctx.fillRect(0, 0, combinedCanvas.width, combinedCanvas.height);
                
                // Draw front card
                ctx.drawImage(canvasFront, 0, 0);

                // Download
                combinedCanvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'musicfest-id-card.png';
                    a.click();
                    URL.revokeObjectURL(url);
                });

            } catch (err) {
                console.error('Download error:', err);
                alert('Error generating image. Please try again.');
            } finally {
                scaleCard();
            }
        });

        async function shareToInstagram() {
            const cardElement = document.getElementById('idCard'); // The ID of your card container

            if (!cardElement) {
                alert("Card element not found!");
                return;
            }

            try {
                // 1. Generate the image using html2canvas
                const canvas = await html2canvas(cardElement, {
                    scale: 2, // Higher scale for better quality on Instagram
                    backgroundColor: null, // Preserves transparency if you have any
                    useCORS: true // Helps with loading cross-origin images
                });

                // 2. Convert the canvas to a Blob (file object)
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert('Failed to generate image.');
                        return;
                    }

                    // 3. Create a File object from the Blob
                    const file = new File([blob], 'musicfest-id.png', { type: 'image/png' });

                    // 4. Use the Web Share API to share the file
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'My MusicFest ID',
                                text: 'See you at MusicFest! #MusicFest2026'
                            });
                            console.log('Shared successfully');
                        } catch (shareError) {
                            // User likely cancelled the share sheet
                            console.log('Share cancelled', shareError);
                        }
                    } else {
                        // Fallback for desktop or unsupported browsers
                        alert('Direct sharing is not supported on this browser. Please download the image instead.');
                    }
                }, 'image/png');

            } catch (error) {
                console.error('Error generating card:', error);
                alert('An error occurred while creating the image.');
            }
        }

    </script>
</body>
<html>
